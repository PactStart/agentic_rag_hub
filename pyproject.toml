[project]
name = "agentic-rag-hub"
version = "0.1.0"
description = "企业向 Agentic RAG：硅基 BGE + 插件化解析/检索 + LangGraph"
readme = "README.md"
authors = [
    { name = "rex.lei", email = "1203208955@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.29.0,<6",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.4.0",
    "langchain-text-splitters>=1.0.0",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "openai>=3.13.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "elasticsearch>=8.15.0,<9",
    "neo4j>=5.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14",
    "pyrate-limiter>=3.0",
    "tenacity>=8.0",
    "pymilvus>=2.5.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
eval = [
    "pandas>=2.2,<3",
    "ragas>=0.3.1",
    "evaluate>=0.4.3",
    "rouge-score>=0.1.2",
    "text2vec>=1.3.0",
    "numpy>=1.26",
]
graph = [
    "neo4j>=5.0",
]

[project.scripts]
agentic-rag-hub = "src.app:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
