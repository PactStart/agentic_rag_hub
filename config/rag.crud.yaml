# CRUD-RAG 评测轨专用配置。勿与沙盒 config/rag.yaml 共用 index / collection / tenant。
# 连接串仍读 .env。
#
# 语料：data/corpus/80000_docs 下每个文件一行一篇新闻。
# 抽样试跑：uv run python scripts/ingest.py --config config/rag.crud.yaml --limit 1000
# 全量：去掉 --limit

ingest:
  source:
    type: line_corpus
    dir: data/corpus/80000_docs
  routing: []
  default:
    parser: plain_text
    chunker: fixed_size
  # 入库加速（可按机器/配额调大）
  batch:
    wave_size: 500            # 每波文档数；越大吞吐越高、占内存越多
    parse_workers: 8          # 解析/切片线程
    embed_batch: 64           # 单次 embed API 条数
    embed_workers: 4          # 并发 embed 请求数（受 RateBudget 约束）
    milvus_bulk: 1000         # Milvus 单次 upsert 行数

parser:
  plain_text: {}
  markdown: {}

chunking:
  backend: fixed_size
  # 对照官方 CRUD_RAG SimpleNodeParser：chunk_size=128, chunk_overlap=0
  fixed_size:
    chunk_size: 128
    chunk_overlap: 0
  markdown_heading:
    chunk_size: 512
    chunk_overlap: 64

sparse:
  backend: elasticsearch
  elasticsearch:
    url: ${ELASTICSEARCH_URL}
    index: crud_chunks           # 与沙盒 rag_chunks 隔离

vector:
  backend: milvus                # 也可改 qdrant；collection 必须独立
  milvus:
    uri: ${MILVUS_URI}
    collection: crud_bge_m3
    token: ${MILVUS_TOKEN}
  qdrant:
    url: ${QDRANT_URL}
    collection: crud_bge_m3
    api_key: ${QDRANT_API_KEY}

embed_dim: 1024

ledger:
  backend: mysql
  tenant_id: crud                # 与沙盒 default 租户隔离
  mysql:
    dsn: ${MYSQL_DSN}

acl:
  default: ["all"]               # 公开评测不按角色裁剪

crud_eval:
  retrieve_top_k: 8
  recall_k: 16
  top_k: 8
  use_rerank: true
  refuse: false
  temperature: 0.1
  split_json: data/corpus/crud_split/split_merged.json
  corpus_dir: data/corpus/80000_docs
  note: >
    官方向量多为 bge-base-zh + Milvus；本轨用硅基 BGE-M3（1024 维）。
    分数勿与论文表直接横比。line_corpus：目录内每个文件按行拆成文档再 fixed_size 切片。

retrieve:
  recall_k: 16
  top_k: 8
  rrf_k: 60
  sparse_score:
    gt: 0
    gte: null
    lt: null
    lte: null
    relative_gte: null
    keep_at_least: 0
  vector_score:
    gt: null
    gte: null
    lt: null
    lte: null
    relative_gte: null
    keep_at_least: 0
  rerank_score:
    gt: null
    gte: null
    lt: null
    lte: null
    relative_gte: null
    keep_at_least: 0
